[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dadip"
version = "2.0.0a1"
description = "DADIP 2.0 backend: AURA intelligence, cloud core, resilient communication engine, edge agent and network simulator"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "redis>=5.0",
  "celery>=5.4",
  "paho-mqtt>=2.1",
  "httpx>=0.27",
  "numpy>=1.26",
  "email-validator>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
dadip-edge = "dadip.edge.agent:main"
dadip-sim = "dadip.simulation.experiments:main"
dadip-dispatcher = "dadip.comms.worker:main"

[tool.setuptools.packages.find]
include = ["dadip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs real PostgreSQL / Redis / Mosquitto (see docs/development.md)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"dadip/simulation/*" = ["S311"]
"dadip/aura/pipeline.py" = ["S311"]  # seeded RNG for reproducible sensitivity analysis, not security
"migrations/versions/*" = ["E501"]
