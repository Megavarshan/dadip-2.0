name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: dadip, POSTGRES_PASSWORD: dadip, POSTGRES_DB: dadip_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dadip" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Start Mosquitto
        run: docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
        env: {DADIP_TEST_DATABASE_URL: "postgresql+psycopg://dadip:dadip@localhost:5432/dadip_test"}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
